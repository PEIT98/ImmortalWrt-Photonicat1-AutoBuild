name: Photonicat1 ImmortalWrt QModem Build

# Only manual builds. No push or schedule trigger.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: '编译成功后上传为预发布（测试版）'
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: photonicat1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      release_tag: ${{ steps.firmware_identity.outputs.release_tag }}
    env:
      TZ: Asia/Shanghai
      # photonicat-cache-v2: bounded OpenWrt compiler object cache.
      CCACHE_DIR: ${{ github.workspace }}/immortalwrt/.ccache
      CCACHE_MAXSIZE: 1536M
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4

      - name: Checkout latest ImmortalWrt 25.12
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: openwrt-25.12
          path: immortalwrt
          fetch-depth: 40

      - name: Checkout pinned Photonicat1 reference
        uses: actions/checkout@v4
        with:
          repository: a757814283/ImmortalWrt_Photonicat1
          ref: 707cd8c57d6d221dec033aa75a3a7580f1a4ddf9
          path: photonicat-reference
          fetch-depth: 1

      - name: Free build space
        run: |
          df -h
          free -h
          lsblk
          # 当前 ubuntu-24.04 Runner 只有一个 root 分区，/mnt 没有独立挂载。
          # 因此不直接照搬西瓜皮的 maximize-build-space LVM 工具。
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler \
            flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man \
            intltool jq libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libreadline-dev libssl-dev libtool \
            lrzsz mkisofs msmtp ninja-build patch pkgconf python3 python3-pyelftools \
            python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig \
            texinfo unzip vim wget xmlto xxd zlib1g-dev zstd python3-ply python3-docutils re2c
          sudo apt-get clean
          df -h /

      - name: Set download cache month
        id: cache_epoch
        shell: bash
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: 准备光影猫配置与 QModem
        run: bash scripts/build/prepare.sh "$GITHUB_WORKSPACE/photonicat-reference" "$GITHUB_WORKSPACE/immortalwrt" "$GITHUB_WORKSPACE/files"

      - name: 启用板载 QCA9377 SDIO 并保留 PCIe
        run: |
          python3 scripts/patches/enable-qca9377-ath10k-sdio.py "$GITHUB_WORKSPACE/immortalwrt"
          grep -Fq 'ATH10K ATH10K_PCI ATH10K_SDIO' immortalwrt/package/kernel/mac80211/ath.mk
          grep -Fq 'ath10k/ath10k_sdio.ko' immortalwrt/package/kernel/mac80211/ath.mk

      - name: 更新官方 QModem 与自有 Generic 软件源
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -a -f -p qmodem
          ./scripts/feeds install -a -f -p qmodem_generic
          # 官方 QModem 与 PEIT98 Generic 均拉取 main；检查 Next 和 Generic 的实际依赖。
          test -f feeds/qmodem/application/qmodem/Makefile
          test -f feeds/qmodem/luci/luci-app-qmodem-next/Makefile
          test -f feeds/qmodem/application/qmodem_smsd/Makefile
          test -f feeds/qmodem/application/sms_forwarder_next/Makefile
          test -f feeds/qmodem_generic/luci-app-qmodem-generic/Makefile
          test -L package/feeds/qmodem_generic/luci-app-qmodem-generic
          python3 - <<'PY'
          import re
          from pathlib import Path
          next_make = Path('feeds/qmodem/luci/luci-app-qmodem-next/Makefile').read_text()
          generic_make = Path('feeds/qmodem_generic/luci-app-qmodem-generic/Makefile').read_text()
          def dependencies(text):
              line = re.search(r'^LUCI_DEPENDS\s*:?=([^\n]+)', text, re.M)
              assert line, '上游 LUCI_DEPENDS 定义变化，请检查插件依赖'
              return set(re.findall(r'\+([\w+.-]+)', line.group(1)))
          assert {'qmodem', 'qmodem-smsd', 'sms-forwarder-next', 'luci-base'} <= dependencies(next_make)
          assert {'qmodem', 'luci-base'} <= dependencies(generic_make)
          version = re.search(r'^QMODEM_VERSION\s*:?=\s*(\S+)', Path('feeds/qmodem/version.mk').read_text(), re.M)
          assert version and re.fullmatch(r'[0-9]+(?:\.[0-9]+)*(?:_(?:alpha|beta|pre|rc)[0-9]*)?', version.group(1)), 'QModem 版本格式不适用于 APK，请检查上游 version.mk'
          PY
          # Feeds 保留上游执行权限，确保 Generic 后台任务和缓存服务能被 rpcd/procd 调用。
          generic_root=feeds/qmodem_generic/luci-app-qmodem-generic/root
          test -x "$generic_root/usr/bin/qmodem-task"
          test -x "$generic_root/usr/sbin/qmodem-worker"
          test -x "$generic_root/usr/libexec/rpcd/qmodem_cache"
          ./scripts/feeds install -a -f -p openclash
          # iStore's Lua taskd / UI packages take precedence from official iStore feed.
          ./scripts/feeds install -a -f -p istore
          # 优先使用项目内的完整 luci-app-cpufreq，不保留 Feeds 重名软件包链接。
          # 只移除软件源生成的符号链接；若上游布局变化为真实目录则停止，避免误删除。
          cpu_feed_link=package/feeds/luci/luci-app-cpufreq
          if [ -L "$cpu_feed_link" ]; then
            rm -- "$cpu_feed_link"
          elif [ -e "$cpu_feed_link" ]; then
            echo "::error::官方 CPUFreq 插件不是符号链接，需人工检查；已停止替换"
            exit 1
          fi
          test -f package/luci-app-cpufreq/Makefile
          grep -Fxq 'include $(TOPDIR)/feeds/luci/luci.mk' package/luci-app-cpufreq/Makefile
          echo 'CPUFreq 插件将以项目内源码编译，保留 cpufreq 后端与简体中文翻译。'
          # 移除 LuCI Feed 的同名符号链接，避免双份电池插件注册。
          battery_feed_link=package/feeds/luci/luci-mod-battstatus
          if [ -L "$battery_feed_link" ]; then
            rm -- "$battery_feed_link"
          elif [ -e "$battery_feed_link" ]; then
            echo "::error::官方电池插件不是符号链接，停止以保护 Feeds 文件"
            exit 1
          fi
          test ! -e package/luci-mod-battstatus
          test ! -e package/pcat-manager-v1
          test -f package/luci-app-photonicat-power/Makefile
          grep -Fxq 'include $(INCLUDE_DIR)/meson.mk' package/luci-app-photonicat-power/Makefile
          grep -Fxq 'PKG_BUILD_DEPENDS:=luci-base/host' package/luci-app-photonicat-power/Makefile
          echo '单一光影猫电源包将提供 MCU 服务、页面、电池状态和中文翻译。'

      - name: 修复 iStore 软件包名称
        run: bash scripts/patches/fix-istore-25.12.sh "$GITHUB_WORKSPACE/immortalwrt"

      - name: 核对新增管理插件与 CAKE 接入
        working-directory: immortalwrt
        run: |
          test -f feeds/luci/applications/luci-app-filemanager/Makefile
          test -f feeds/luci/applications/luci-app-statistics/Makefile
          test -f feeds/luci/applications/luci-app-travelmate/Makefile
          test -f package/luci-app-aurora-config/Makefile
          test -x package/luci-app-aurora-config/root/usr/libexec/rpcd/luci.aurora
          grep -Fxq 'LUCI_MINIFY_JS:=0' package/luci-app-aurora-config/Makefile
          diff -r ../packages/cake-autorate package/cake-autorate
          sh -n files/etc/uci-defaults/92-photonicat-network-tools
          sh -n package/cake-autorate/files/cake-autorate.init
          sh -n package/cake-autorate/files/cake-autorate-prepare
          sh -n package/cake-autorate/files/98-cake-autorate
          python3 ../scripts/tests/test_cake_autorate.py

      - name: 核对光影猫在线升级
        working-directory: immortalwrt
        run: |
          test -f package/luci-app-online-upgrade/Makefile
          sh -n package/luci-app-online-upgrade/root/usr/bin/online-upgrade.sh
          sh -n package/luci-app-online-upgrade/root/etc/uci-defaults/99-online-upgrade
          test -x package/luci-app-online-upgrade/root/usr/bin/online-upgrade.sh
          diff -r ../packages/luci-app-online-upgrade package/luci-app-online-upgrade
          grep -Fq 'photonicat-online-upgrade-adapted' package/luci-app-online-upgrade/root/www/luci-static/resources/view/system/online-upgrade.js
          ! grep -Fq '$(1)/www/cgi-bin/online-upgrade-restore' package/luci-app-online-upgrade/Makefile
          test ! -e package/luci-app-online-upgrade/root/www/cgi-bin/online-upgrade-restore
          python3 ../scripts/tests/test_online_upgrade.py

      - name: Check Photonicat1 status and Docker storage diagnostics
        working-directory: immortalwrt
        shell: bash
        run: |
          set -euo pipefail
          sh -n files/usr/libexec/rpcd/luci.photonicat1
          sh -n files/usr/bin/photonicat-docker-storage-check
          python3 -m json.tool files/usr/share/rpcd/acl.d/luci-photonicat1-info.json >/dev/null
          test -x files/usr/libexec/rpcd/luci.photonicat1
          test -x files/usr/bin/photonicat-docker-storage-check
          test -f files/www/luci-static/resources/view/status/include/99_photonicat1_info.js
          # 一个软件包安装 MCU 后台、管理页面、顶部设备状态与中文翻译。
          power_pkg=package/luci-app-photonicat-power
          diff -r ../packages/luci-app-photonicat-power "$power_pkg"
          test ! -e package/luci-mod-battstatus
          test ! -e package/pcat-manager-v1
          test ! -e package/feeds/luci/luci-mod-battstatus && test ! -L package/feeds/luci/luci-mod-battstatus
          batt_js="$power_pkg/htdocs/luci-static/resources/preload/battstatus.js"
          test -s "$batt_js"
          grep -Fq "object: 'luci.battstatus'" "$batt_js"
          grep -Fq "photonicat-header-style" "$batt_js"
          grep -Fq "object: 'luci.photonicat_header'" "$batt_js"
          grep -Fq "poll.add(L.bind(this.updateIndicator, this), 5)" "$batt_js"
          node ../scripts/tests/test_photonicat_header.js
          node ../scripts/tests/test_photonicat_header_backend.js
          test -s "$power_pkg/htdocs/luci-static/resources/photonicat-header.css"
          test -x "$power_pkg/root/usr/libexec/rpcd/luci.photonicat_header"
          test -x "$power_pkg/root/usr/libexec/rpcd/luci.battstatus"
          grep -Fq "luci.photonicat_power battery" "$power_pkg/root/usr/libexec/rpcd/luci.battstatus"
          test -f "$power_pkg/root/etc/config/luci_battstatus"
          grep -Fq '"setSettings"' "$power_pkg/root/usr/libexec/rpcd/luci.battstatus"
          sh -n "$power_pkg/root/usr/libexec/rpcd/luci.battstatus" "$power_pkg/root/usr/libexec/rpcd/luci.photonicat_power" "$power_pkg/root/usr/libexec/rpcd/luci.photonicat_header"
          sh -n "$power_pkg/files/pcat-manager.init" "$power_pkg/files/98-photonicat-battery-language"
          python3 -m json.tool "$power_pkg/root/usr/share/rpcd/acl.d/luci-app-photonicat-power.json" >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          acl = json.loads(Path('package/luci-app-photonicat-power/root/usr/share/rpcd/acl.d/luci-app-photonicat-power.json').read_text())['luci-app-photonicat-power']
          assert {'getBatteryStatus', 'getSettings'} <= set(acl['read']['ubus']['luci.battstatus'])
          assert {'status'} <= set(acl['read']['ubus']['luci.photonicat_header'])
          assert {'setSettings'} <= set(acl['write']['ubus']['luci.battstatus'])
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          upstream = json.loads(Path('feeds/qmodem/luci/luci-app-qmodem-next/root/usr/share/luci/menu.d/luci-app-qmodem-next.json').read_text())
          generic_root = Path('feeds/qmodem_generic/luci-app-qmodem-generic/root')
          generic = json.loads((generic_root / 'usr/share/luci/menu.d/luci-app-qmodem-generic.json').read_text())
          override = json.loads(Path('files/usr/share/luci/menu.d/zz-photonicat-modem-title.json').read_text())
          assert 'admin/modem' in upstream, 'QModem 菜单路径已变更，请检查名称覆盖'
          assert override == {'admin/modem': {'title': '移动网络'}}, '名称覆盖不得更改菜单权限或动作'
          assert 'admin/modem/qmodem' in upstream and 'admin/modem/qmodem-generic' in generic
          assert set(upstream) & set(generic) == {'admin/modem'}, '两套界面的子菜单发生冲突'
          assert upstream['admin/modem']['action'] == generic['admin/modem']['action'], '父菜单动作不一致'
          generic_files = {p.relative_to(generic_root) for p in generic_root.rglob('*') if p.is_file()}
          for root in (Path('feeds/qmodem/application/qmodem/files'), Path('feeds/qmodem/luci/luci-app-qmodem-next/root')):
              shared = generic_files & {p.relative_to(root) for p in root.rglob('*') if p.is_file()}
              assert not shared, f'上游插件安装文件重名：{sorted(map(str, shared))}'
          PY
          test -f "$power_pkg/po/zh_Hans/battstatus.po"
          grep -Fq 'po2lmo ./po/zh_Hans/battstatus.po' "$power_pkg/Makefile"
          grep -Fq 'pcat-manager' "$power_pkg/Makefile"
          grep -Fq "option enable_traffic '0'" package/photonicat-bandix-plus/files/bandix_plus.config
          test -f package/luci-app-bandix-plus/Makefile
          test -f package/luci-app-cpufreq/Makefile
          test -f package/luci-app-cpufreq/htdocs/luci-static/resources/view/cpufreq.js
          test -f package/luci-app-cpufreq/root/usr/share/luci/menu.d/luci-app-cpufreq.json
          test -f package/luci-app-cpufreq/root/usr/share/rpcd/acl.d/luci-app-cpufreq.json
          test -f package/luci-app-cpufreq/po/zh_Hans/cpufreq.po
          test ! -e package/feeds/luci/luci-app-cpufreq && test ! -L package/feeds/luci/luci-app-cpufreq
          grep -Fxq 'LUCI_NAME:=luci-app-store' package/feeds/istore/luci-app-store/Makefile
          echo '光影猫只读状态卡片已集成，Bandix Plus 首次流量挂钩默认关闭。'


      - name: 应用并核对固件配置
        working-directory: immortalwrt
        run: |
          # 修改过 iStore Makefile 后，强制重新扫描包定义，避免复用旧缓存。
          rm -f tmp/.packageinfo tmp/.config-package.in
          # feeds install -a 会重置 .config，因此必须在安装完成后再应用选项
          python3 ../scripts/build/select-packages.py .config
          cp .config .config.before-defconfig
          echo '===== defconfig 前核心插件 ====='
          grep -E '^CONFIG_PACKAGE_(qmodem|luci-app-qmodem-next|luci-app-qmodem-generic|qmodem-smsd|sms-forwarder-next|mwan3|luci-app-mwan3|luci-app-openclash|luci-app-photonicat-power|luci-app-ttyd|luci-theme-aurora|luci-app-store|luci-app-dockerman|docker|dockerd|docker-compose|luci-app-bandix-plus|bandix-plus|kmod-rtw89-8922ae|kmod-mt7925e|kmod-ath12k)=' .config.before-defconfig || true
          make defconfig
          echo '===== 核对上游插件是否被注册为目标包 ====='
          for pkg in qmodem luci-app-qmodem-next luci-app-qmodem-generic qmodem-smsd sms-forwarder-next luci-app-online-upgrade luci-app-store luci-lib-taskd taskd luci-app-bandix-plus bandix-plus luci-app-cpufreq luci-app-photonicat-power luci-app-filemanager luci-app-aurora-config luci-app-statistics luci-app-travelmate cake-autorate luci-app-sqm; do
            if grep -Fxq "Package: $pkg" tmp/.packageinfo; then
              echo "registered: $pkg"
            else
              echo "::warning::包元数据中找不到 $pkg；检查对应 Makefile 是否被扫描到"
            fi
          done
          echo '===== defconfig 后核心插件 ====='
          grep -E '^(# )?CONFIG_PACKAGE_(qmodem|luci-app-qmodem-next|luci-app-qmodem-generic|qmodem-smsd|sms-forwarder-next|mwan3|luci-app-mwan3|luci-app-openclash|luci-app-photonicat-power|luci-app-ttyd|luci-theme-aurora|luci-app-store|luci-app-dockerman|docker|dockerd|docker-compose|luci-app-bandix-plus|bandix-plus|kmod-rtw89-8922ae|kmod-mt7925e|kmod-ath12k)(=| is not set)' .config || true
          echo '===== defconfig 前已选但后被取消的选项（最多70行）====='
          comm -23 <(grep '^CONFIG_PACKAGE_.*=y$' .config.before-defconfig | sort -u) <(grep '^CONFIG_PACKAGE_.*=y$' .config | sort -u) | head -n 70 || true
          bash ../scripts/build/verify-config.sh .config
          echo '===== 确认 Ruby YJIT 未启用 ====='
          grep -F '# CONFIG_RUBY_ENABLE_YJIT is not set' .config
          df -h .

      - name: Upload resolved config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photonicat1-build-config
          path: |
            immortalwrt/.config
            immortalwrt/.config.before-defconfig
            immortalwrt/feeds.conf.default
            immortalwrt/tmp/.packageinfo
            immortalwrt/tmp/.config-package.in
          include-hidden-files: true
          retention-days: 14

      - name: 生成在线升级版本标识
        id: firmware_identity
        shell: bash
        run: |
          set -euo pipefail
          tag="photonicat1-$(date +%Y%m%d-%H%M%S)-${GITHUB_RUN_NUMBER}"
          [[ "$tag" =~ ^photonicat1-[0-9]{8}-[0-9]{6}-[0-9]+$ ]]
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          mkdir -p immortalwrt/files/etc
          cat > immortalwrt/files/etc/online-upgrade-device <<EOF
          # 本次固件的只读版本身份，发布任务使用同一个标签。
          DEVICE_BOARD='ariaboard,photonicat'
          BUILD_TAG='$tag'
          BUILD_COMMIT='$GITHUB_SHA'
          EOF

      - name: 获取并验证最新 OpenClash Meta 内核
        shell: bash
        run: |
          bash scripts/build/bundle-openclash-core.sh immortalwrt/files
          sh -n immortalwrt/files/etc/uci-defaults/zz-photonicat-openclash-core
          test -x immortalwrt/files/usr/libexec/photonicat/openclash/clash_meta

      - name: Write build provenance inside firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p immortalwrt/files/etc
          {
            echo 'Device: Photonicat1 / RK3568'
            echo "Build time: $(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "Builder commit: $GITHUB_SHA"
            echo "ImmortalWrt: $(git -C immortalwrt rev-parse HEAD)"
            echo "QModem: $(git -C immortalwrt/feeds/qmodem rev-parse HEAD)"
            echo "QModem Generic: $(git -C immortalwrt/feeds/qmodem_generic rev-parse HEAD)"
            cat immortalwrt/files/usr/libexec/photonicat/openclash/build-info
            echo "Online upgrade: packages/luci-app-online-upgrade (builder $GITHUB_SHA)"
            echo "Release tag: ${{ steps.firmware_identity.outputs.release_tag }}"
            echo "Aurora theme: $(git -C immortalwrt/package/luci-theme-aurora rev-parse HEAD)"
            echo "Aurora config: $(git -C immortalwrt/package/luci-app-aurora-config rev-parse HEAD)"
            sed -n 's/^PKG_SOURCE_VERSION:=/cake-autorate stable source: /p' packages/cake-autorate/Makefile
            echo "Reference: $(git -C photonicat-reference rev-parse HEAD)"
          } > immortalwrt/files/etc/photonicat1-build-info

      - name: Restore downloaded source cache
        id: download_cache
        uses: actions/cache/restore@v5
        with:
          path: immortalwrt/dl
          key: photonicat1-dl-v2-${{ runner.os }}-${{ steps.cache_epoch.outputs.month }}
          restore-keys: |
            photonicat1-dl-v2-${{ runner.os }}-

      - name: Download sources
        working-directory: immortalwrt
        run: make download -j4

      - name: Save source downloads
        if: steps.download_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: immortalwrt/dl
          key: photonicat1-dl-v2-${{ runner.os }}-${{ steps.cache_epoch.outputs.month }}

      - name: Restore OpenWrt CCache
        id: compiler_cache
        uses: actions/cache/restore@v5
        with:
          path: immortalwrt/.ccache
          key: photonicat1-ccache-v2-${{ runner.os }}-${{ hashFiles('immortalwrt/.config') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            photonicat1-ccache-v2-${{ runner.os }}-${{ hashFiles('immortalwrt/.config') }}-
            photonicat1-ccache-v2-${{ runner.os }}-

      - name: Initialize OpenWrt CCache
        shell: bash
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --max-size 1536M
          ccache --zero-stats
          echo "Downloaded source cache hit: ${{ steps.download_cache.outputs.cache-hit }}"
          echo "Compiler cache hit: ${{ steps.compiler_cache.outputs.cache-hit }}"
          ccache --show-stats
          du -sh immortalwrt/dl "$CCACHE_DIR" 2>/dev/null || true
          df -h immortalwrt

      - name: 编译光影猫固件
        working-directory: immortalwrt
        shell: bash
        run: |
          set -euo pipefail
          # 镜像打包前写入时钟下限：编译开始时刻（UTC）加两小时。
          # 开机脚本仅在设备时钟早于该值时设置，不覆盖已校准的时间。
          time_floor=$(($(date -u +%s) + 7200))
          printf '%s\n' "$time_floor" > files/etc/photonicat1-time-floor
          echo "Firmware initial clock floor (UTC): $(date -u -d "@$time_floor" '+%Y-%m-%d %H:%M:%S')"
          echo '===== 开始编译前的磁盘与内存 ====='
          df -h .
          free -h
          # GitHub runners vary in available CPUs: use up to 3 jobs, never exceed nproc.
          jobs="$(nproc)"
          [ "$jobs" -le 3 ] || jobs=3
          echo "Build concurrency: -j$jobs (capped at 3)"
          if ! make -j"$jobs" V=0; then
            echo '===== 首次编译失败，检查剩余空间 ====='
            df -h .
            free -h
            available_kib=$(df -Pk . | awk 'NR==2 {print $4}')
            if [ "$available_kib" -lt 3145728 ]; then
              echo "::error::剩余磁盘不足 3GiB，禁止再次编译：应先释放空间或减少依赖"
              exit 1
            fi
            echo '::warning::并行编译失败且空间尚充足，尝试单线程 V=s 定位真实错误'
            make -j1 V=s
          fi

      - name: Report compiler cache
        if: always()
        shell: bash
        run: |
          echo '===== CCache hit/miss report ====='
          ccache --show-stats || true
          du -sh immortalwrt/dl "$CCACHE_DIR" 2>/dev/null || true
          df -h immortalwrt || true
          {
            echo '### ImmortalWrt compiler cache'
            echo
            echo '- Downloaded source cache hit: ${{ steps.download_cache.outputs.cache-hit }}'
            echo '- Compiler cache hit: ${{ steps.compiler_cache.outputs.cache-hit }}'
            echo
            echo '```text'
            ccache --show-stats || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save updated CCache
        if: always() && steps.compiler_cache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: immortalwrt/.ccache
          key: photonicat1-ccache-v2-${{ runner.os }}-${{ hashFiles('immortalwrt/.config') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 收集固件及编译信息
        shell: bash
        run: |
          set -euo pipefail
          out='immortalwrt/bin/targets/rockchip/armv8'
          mkdir -p release
          test -d "$out"
          shopt -s nullglob
          # Timestamp after the firmware build succeeds (Asia/Shanghai, YYYYMMDDHH).
          # Only collect the squashfs sysupgrade image; ext4 filesystem support in the kernel remains enabled.
          build_hour="$(TZ=Asia/Shanghai date +%Y%m%d%H)"
          [[ "$build_hour" =~ ^[0-9]{10}$ ]] || { echo 'Invalid build timestamp' >&2; exit 1; }
          n=0
          for f in "$out"/*ariaboard_photonicat-squashfs-sysupgrade.img.gz; do
            [ -f "$f" ] || continue
            filename="${f##*/}"
            if [[ "$filename" == *-sysupgrade.img.gz ]]; then
              filename="${filename%-sysupgrade.img.gz}-sysupgrade_${build_hour}.img.gz"
            fi
            cp -- "$f" "release/$filename"
            echo "Firmware Release asset: $filename"
            n=$((n+1))
          done
          [ "$n" -gt 0 ] || { echo 'Photonicat1 squashfs sysupgrade image not found!' >&2; exit 1; }
          for f in "$out"/*ariaboard_photonicat*.manifest "$out"/config.buildinfo "$out"/feeds.buildinfo "$out"/version.buildinfo "$out"/profiles.json; do
            [ -f "$f" ] && cp "$f" release/
          done
          {
            echo 'Device: Ariaboard Photonicat1 (RK3568)'
            echo "ImmortalWrt source: $(git -C immortalwrt rev-parse HEAD)"
            echo "Reference config: $(git -C photonicat-reference rev-parse HEAD)"
            echo "QModem feed: FUjr/QModem main"
            echo "QModem feed: $(git -C immortalwrt/feeds/qmodem rev-parse HEAD)"
            echo "QModem Generic feed: PEIT98/luci-app-qmodem-generic main"
            echo "QModem Generic commit: $(git -C immortalwrt/feeds/qmodem_generic rev-parse HEAD)"
            echo "Online upgrade source: packages/luci-app-online-upgrade"
            echo "Online upgrade commit: $GITHUB_SHA"
            echo "Release tag: ${{ steps.firmware_identity.outputs.release_tag }}"
            echo "Aurora theme: $(git -C immortalwrt/package/luci-theme-aurora rev-parse HEAD)"
            echo "Aurora config: $(git -C immortalwrt/package/luci-app-aurora-config rev-parse HEAD)"
            sed -n 's/^PKG_SOURCE_VERSION:=/cake-autorate stable source: /p' packages/cake-autorate/Makefile
            echo "Workflow repo commit: $GITHUB_SHA"
            echo "Built at (Asia/Shanghai): $(date '+%Y-%m-%d %H:%M:%S %Z')"
          } > release/build-sources.txt
          git -C immortalwrt log -n 25 --format='%h %cs %s' > release/immortalwrt-recent-commits.txt
          (cd release && find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt)
          bash scripts/build/release-notes.sh release
          ls -lah release

      - name: Build diagnostic on failure
        if: failure()
        shell: bash
        run: |
          df -h || true
          free -h || true
          du -sh immortalwrt/build_dir immortalwrt/staging_dir immortalwrt/dl immortalwrt/bin 2>/dev/null || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: photonicat1-qmodem-firmware
          path: release/
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: photonicat1-qmodem-firmware
          path: release

      - name: Prepare tag
        id: tag
        shell: bash
        env:
          PHOTONICAT_RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$PHOTONICAT_RELEASE_TAG" =~ ^photonicat1-[0-9]{8}-[0-9]{6}-[0-9]+$ ]]
          echo "name=$PHOTONICAT_RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: 光影猫一代 Photonicat-Wrt + QModem ${{ steps.tag.outputs.name }}
          prerelease: true
          draft: false
          make_latest: "false"
          body_path: release/release-notes.md
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: false
