name: Build QCNFA765 e108 board packages

on:
  push:
    paths:
      - '.github/workflows/build-qcnfa765-e108-packages.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare package source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p pkg/qcnfa765-e108-board/files/usr/share/qcnfa765-e108
          mkdir -p pkg/qcnfa765-e108-board/files/usr/sbin

          curl -L --fail --retry 3 --connect-timeout 20             -o pkg/qcnfa765-e108-board/files/usr/share/qcnfa765-e108/board-2.bin             'https://lists.infradead.org/pipermail/ath11k/attachments/20241201/646a4295/attachment-0001.bin'

          echo 'ded4d57897bff49de5af7434e66c294a456c06b2165c207331cab3e209f3ae9d  pkg/qcnfa765-e108-board/files/usr/share/qcnfa765-e108/board-2.bin' | sha256sum -c -

          cat > pkg/qcnfa765-e108-board/files/usr/sbin/qcnfa765-e108-install <<'EOS'
          #!/bin/sh
          set -eu

          src='/usr/share/qcnfa765-e108/board-2.bin'
          expected='ded4d57897bff49de5af7434e66c294a456c06b2165c207331cab3e209f3ae9d'
          dir='/lib/firmware/ath11k/WCN6855/hw2.1'

          [ -f "$src" ] || {
              echo "缺少内置 board-2.bin：$src"
              exit 1
          }

          actual="$(sha256sum "$src" | awk '{print $1}')"
          [ "$actual" = "$expected" ] || {
              echo '内置 board-2.bin 校验失败，停止修改'
              exit 1
          }

          if [ -L "$dir" ]; then
              target_dir="$(readlink -f "$dir")"
              [ -n "$target_dir" ] && [ -d "$target_dir" ] || {
                  echo "hw2.1 符号链接无效：$dir"
                  exit 1
              }
              echo "检测到 hw2.1 -> $target_dir，保留原目录结构"
          elif [ -d "$dir" ]; then
              target_dir="$dir"
          else
              echo "未找到 $dir；请先安装 WCN6855/ath11k 固件"
              exit 1
          fi

          dst="$target_dir/board-2.bin"
          backup="$(mktemp -d /root/qcnfa765-backup.XXXXXX)"

          if [ -f "$dst" ]; then
              cp -L "$dst" "$backup/board-2.bin"
          fi

          stage="$(mktemp "$target_dir/.board-2.bin.XXXXXX")"
          trap 'rm -f "$stage"' EXIT
          cp "$src" "$stage"
          chmod 644 "$stage"
          mv -f "$stage" "$dst"
          trap - EXIT

          installed="$(sha256sum "$dst" | awk '{print $1}')"
          [ "$installed" = "$expected" ] || {
              echo '目标文件校验失败'
              exit 1
          }

          sync
          echo "QCNFA765 105b:e108 board 已安装"
          echo "原 board 备份：$backup"
          echo "请执行 reboot 后生效"
          EOS
          chmod 755 pkg/qcnfa765-e108-board/files/usr/sbin/qcnfa765-e108-install

          cat > pkg/qcnfa765-e108-board/Makefile <<'EOS'
          include $(TOPDIR)/rules.mk

          PKG_NAME:=qcnfa765-e108-board
          PKG_VERSION:=1.0
          PKG_RELEASE:=1
          PKGARCH:=all

          include $(INCLUDE_DIR)/package.mk

          define Package/qcnfa765-e108-board
            SECTION:=firmware
            CATEGORY:=Firmware
            TITLE:=QCNFA765 WCN6855 Foxconn 105b:e108 board fix
          endef

          define Package/qcnfa765-e108-board/description
            Offline board-2.bin fix for QCNFA765/WCN6855 Foxconn subsystem 105b:e108,
            including qmi-chip-id 2 and 18 with qmi-board-id 255.
          endef

          define Build/Compile
          endef

          define Package/qcnfa765-e108-board/install
          	$(INSTALL_DIR) $(1)/usr/share/qcnfa765-e108
          	$(INSTALL_DATA) ./files/usr/share/qcnfa765-e108/board-2.bin $(1)/usr/share/qcnfa765-e108/board-2.bin
          	$(INSTALL_DIR) $(1)/usr/sbin
          	$(INSTALL_BIN) ./files/usr/sbin/qcnfa765-e108-install $(1)/usr/sbin/qcnfa765-e108-install
          endef

          define Package/qcnfa765-e108-board/postinst
          #!/bin/sh
          [ -n "$$IPKG_INSTROOT" ] && exit 0
          /usr/sbin/qcnfa765-e108-install
          endef

          $(eval $(call BuildPackage,qcnfa765-e108-board))
          EOS

      - name: Build IPK with OpenWrt 24.10.1 SDK
        shell: bash
        run: |
          set -euxo pipefail
          url='https://downloads.openwrt.org/releases/24.10.1/targets/rockchip/armv8/openwrt-sdk-24.10.1-rockchip-armv8_gcc-13.3.0_musl.Linux-x86_64.tar.zst'
          curl -L --fail --retry 3 -o sdk24.tar.zst "$url"
          echo 'd24322d462c7ab056e06f71642a5a02935be6798d01f71e65f0750556beaf656  sdk24.tar.zst' | sha256sum -c -
          mkdir sdk24
          tar --zstd -xf sdk24.tar.zst -C sdk24 --strip-components=1
          cp -a pkg/qcnfa765-e108-board sdk24/package/
          cd sdk24
          echo 'CONFIG_PACKAGE_qcnfa765-e108-board=y' > .config
          make defconfig
          make package/qcnfa765-e108-board/compile V=s
          cd ..
          mkdir -p out
          find sdk24/bin -type f -name 'qcnfa765-e108-board*.ipk' -exec cp -v {} out/ \;
          test -n "$(find out -name '*.ipk' -print -quit)"

      - name: Build APK v3 with OpenWrt 25.12.6 SDK
        shell: bash
        run: |
          set -euxo pipefail
          url='https://downloads.openwrt.org/releases/25.12.6/targets/rockchip/armv8/openwrt-sdk-25.12.6-rockchip-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst'
          curl -L --fail --retry 3 -o sdk25.tar.zst "$url"
          echo '2a45cbfa7e6cce588d006039205afba03bd242e90d2df4dc442920716a642ce0  sdk25.tar.zst' | sha256sum -c -
          mkdir sdk25
          tar --zstd -xf sdk25.tar.zst -C sdk25 --strip-components=1
          cp -a pkg/qcnfa765-e108-board sdk25/package/
          cd sdk25
          echo 'CONFIG_PACKAGE_qcnfa765-e108-board=y' > .config
          make defconfig
          make package/qcnfa765-e108-board/compile V=s
          cd ..
          find sdk25/bin -type f -name 'qcnfa765-e108-board*.apk' -exec cp -v {} out/ \;
          test -n "$(find out -name '*.apk' -print -quit)"

      - name: Verify outputs
        shell: bash
        run: |
          set -euxo pipefail
          ls -lh out/
          sha256sum out/* > out/SHA256SUMS.txt
          cat out/SHA256SUMS.txt

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: qcnfa765-e108-board-packages
          path: out/*
          if-no-files-found: error
          compression-level: 0
