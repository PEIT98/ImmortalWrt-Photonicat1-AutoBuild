name: Publish existing Photonicat1 firmware

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful Photonicat1 firmware build run ID'
        required: true
        default: '38659188050'
        type: string
permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      SOURCE_RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Verify existing successful build
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid workflow run ID"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > /tmp/source-run.json
          jq -e '.status == "completed" and .conclusion == "success" and .head_branch == "main" and .name == "Photonicat1 ImmortalWrt QModem Build"' /tmp/source-run.json >/dev/null
          echo "sha=$(jq -r '.head_sha' /tmp/source-run.json)" >> "$GITHUB_OUTPUT"
          echo "tag=photonicat1-run-$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Verified successful firmware build run $SOURCE_RUN_ID"

      - name: Download previously compiled firmware
        uses: actions/download-artifact@v4
        with:
          name: photonicat1-qmodem-firmware
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release

      - name: Verify image, provenance and checksums
        shell: bash
        run: |
          set -euo pipefail
          test -s release/release-notes.md
          test -s release/build-sources.txt
          test -s release/SHA256SUMS.txt
          grep -Fxq "Workflow repo commit: ${{ steps.source.outputs.sha }}" release/build-sources.txt
          shopt -s nullglob
          images=(release/*ariaboard_photonicat*sysupgrade*.img.gz)
          [ "${#images[@]}" -gt 0 ] || { echo "No Photonicat1 sysupgrade image in artifact"; exit 1; }
          (cd release && sha256sum -c SHA256SUMS.txt)
          ls -lah release

      - name: Publish existing firmware as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.source.outputs.tag }}
          target_commitish: ${{ steps.source.outputs.sha }}
          name: 光影猫一代 ImmortalWrt + QModem ${{ steps.source.outputs.tag }}
          body_path: release/release-notes.md
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: false
